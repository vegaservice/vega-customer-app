name: Build & Submit to Stores

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android — Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Create Google Play key file
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
        run: printf '%s' "$GOOGLE_PLAY_KEY" > google-play-key.json

      - name: Build & Submit Android
        run: eas build --platform android --profile production --non-interactive --auto-submit

  build-ios:
    name: iOS — Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Write ASC API key
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: printf '%s' "$ASC_KEY" > asc-api-key.p8

      - name: Build iOS
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ./asc-api-key.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit iOS to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ./asc-api-key.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: eas submit --platform ios --profile production --non-interactive --latest
