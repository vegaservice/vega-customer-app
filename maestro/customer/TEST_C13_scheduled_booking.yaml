# TEST_C13 — Scheduled booking — select future date and time
appId: com.vegavizag.app
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "./_login_helper.yaml"
- tapOn: "Home Cleaning"
- tapOn: "1 Hour"
- tapOn: "Add to Cart"
- tapOn: "View Cart"
- tapOn: "Scheduled"
- waitForAnimationToEnd
# Date selector should appear
- assertVisible: "Select Date"
- scroll
# Pick first available date
- tapOn: "Tomorrow"
- tapOn: "08:00 AM"
- tapOn: "Cash"
- tapOn: "Confirm Booking"
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: "Booking Confirmed"
