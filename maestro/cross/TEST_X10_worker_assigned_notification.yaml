# TEST_X10 — Worker assigned → Worker gets push notification
# Requires: Cloud Functions deployed + Worker FCM token registered
appId: com.vegavizag.admin
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "../admin/_login_helper.yaml"
- tapOn: "Bookings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "confirmed"
- tapOn: "Assign Professional"
- waitForAnimationToEnd
- scroll
- tapOn: "Vijaya Lakshmi"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Assigned"
# Expected: Worker phone receives FCM notification "New Job Assigned!"
# Verify in Firebase Console → Cloud Functions → Logs
