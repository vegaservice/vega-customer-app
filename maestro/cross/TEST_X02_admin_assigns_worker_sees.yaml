# TEST_X02 — Admin assigns → Worker sees job in Today tab
# Firestore flow: Admin writes assignedWorkerId → Worker listener fires
appId: com.vegavizag.admin
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "../admin/_login_helper.yaml"
- tapOn: "Bookings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "confirmed"
# Tap first confirmed booking
- tapOn: "Assign Professional"
- waitForAnimationToEnd
- assertVisible: "Select Professional"
# Select first available worker
- scroll
- tapOn: "Vijaya Lakshmi"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Assigned"
# Worker app should now show the job — verify separately in Worker App
