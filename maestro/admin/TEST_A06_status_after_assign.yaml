# TEST_A06 — Status changes to assigned after assignment
appId: com.vegavizag.admin
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "./_login_helper.yaml"
- tapOn: "Bookings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "assigned"
- waitForAnimationToEnd
# Booking that was just assigned should show 'assigned' status chip
- assertVisible: "Assigned"
