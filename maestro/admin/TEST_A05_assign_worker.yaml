# TEST_A05 — Assign worker to booking — Vijaya Lakshmi
# Precondition: Vijaya Lakshmi seeded in workers collection; unassigned booking exists
appId: com.vegavizag.admin
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "./_login_helper.yaml"
- tapOn: "Bookings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "confirmed"
# Tap first confirmed booking
- tapOn: "Assign Professional"
- waitForAnimationToEnd
- assertVisible: "Select Professional"
- tapOn: "Vijaya Lakshmi"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Assigned"
