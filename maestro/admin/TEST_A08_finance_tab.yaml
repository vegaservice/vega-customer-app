# TEST_A08 — Finance tab — shows revenue for completed bookings
appId: com.vegavizag.admin
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "./_login_helper.yaml"
- tapOn: "Finance"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Revenue"
- assertVisible: "Total"
- assertVisible: "completed"
