# TEST_W04 — Tap On My Way — status changes to on_the_way
appId: com.vegavizag.worker
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3500
- runFlow: "./_login_helper.yaml"
- tapOn: "Active"
- waitForAnimationToEnd
- tapOn: "Assigned"
- waitForAnimationToEnd
- assertVisible: "Job Details"
- tapOn: "Start Going"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "On the Way"
- assertVisible: "Customer notified"
